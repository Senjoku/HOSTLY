# ==============================================================================
# HOSTLY — CONFIGURATION DE SÉCURITÉ SERVEUR NGINX (VPS / DOCKER / DÉDIÉ)
# ==============================================================================

# 1. ZONE DE LIMITATION DU DÉBIT (Anti-Brute Force / Anti-DoS)
limit_req_zone $binary_remote_addr zone=hostly_limit:10m rate=15r/s;
limit_req_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name hostly.app www.hostly.app; # Remplacer par votre domaine

    # Redirection HTTP vers HTTPS automatique
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hostly.app www.hostly.app;

    root /var/www/hostly-site;
    index index.html;

    # --------------------------------------------------------------------------
    # SÉCURITÉ SSL / TLS
    # --------------------------------------------------------------------------
    # ssl_certificate /etc/letsencrypt/live/hostly.app/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/hostly.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # --------------------------------------------------------------------------
    # MASQUAGE DE LA SIGNATURE SERVEUR & PROTECTION TAMPONS
    # --------------------------------------------------------------------------
    server_tokens off;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    client_max_body_size 10M;
    large_client_header_buffers 4 8k;

    # --------------------------------------------------------------------------
    # EN-TÊTES DE SÉCURITÉ HTTP (SECURITY HEADERS)
    # --------------------------------------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'self';" always;

    # --------------------------------------------------------------------------
    # PROTECTION DES FICHIERS CACHÉS & SENSIBLES
    # --------------------------------------------------------------------------
    # Bloquer l'accès à tous les fichiers et dossiers commençant par un point (.git, .env...)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Bloquer les fichiers markdown, scripts ou backups
    location ~* \.(md|env|yml|yaml|bak|sql|sh|config|log)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # --------------------------------------------------------------------------
    # GESTION DES REQUÊTES & LIMITATION DU DÉBIT
    # --------------------------------------------------------------------------
    location / {
        limit_req zone=hostly_limit burst=30 nodelay;
        try_files $uri $uri/ /404.html;
    }

    # Page d'erreur 404
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # --------------------------------------------------------------------------
    # CACHE & COMPRESSION ASSETS STATIQUES
    # --------------------------------------------------------------------------
    location ~* \.(css|js|woff2|woff|ttf|svg|png|jpg|jpeg|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;
}
